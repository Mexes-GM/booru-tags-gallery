<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
  <!-- Viewport: removed maximum-scale and user-scalable to avoid accessibility warnings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Booru Tags" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-startup-image" href="/favicon.png" />
  <!-- theme-color (not supported in all desktop browsers, but harmless) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9eff6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2731" />
  <meta name="msapplication-TileColor" content="#154222" />
  <meta name="msapplication-config" content="/browserconfig.xml" />
  <title>Booru Tag Gallery</title>
    <meta name="keywords" content="danbooru,tags,explorer,booru,wiki,anime,art,tags search,fuzzy search,artists,posts gallery" />
    <meta name="author" content="Mexes" />
    <meta name="robots" content="index,follow" />
    <meta name="generator" content="Vite + React" />
    <!-- Minimal Open Graph (solo lo necesario para una preview pequeña en Discord) -->
    <meta property="og:title" content="Booru Tag Gallery" />
  <meta property="og:site_name" content="Booru Tag Gallery" />
  <meta property="og:description" content="Search and quickly discover the tag you need for your image generation." />
  <meta property="og:image" content="/favicon.png" />
  <meta property="og:image:width" content="64" />
  <meta property="og:image:height" content="64" />
    <!-- Preconnect optimizations -->
    <link rel="preconnect" href="https://danbooru.donmai.us" crossorigin />
    <link rel="dns-prefetch" href="https://danbooru.donmai.us" />
    <!-- Structured Data (WebSite + SearchAction) is emitted at runtime by src/components/SEO.tsx
         using VITE_SITE_URL / the current origin, so no domain is hard-coded here. -->
    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null ? JSON.parse(saved) : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
